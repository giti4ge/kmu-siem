[project]
name = "siem-api"
version = "0.1.0"
description = "KMU-SIEM Control-Plane (REST-API, Authentifizierung, Rollen, Audit)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "argon2-cffi>=23.1",
    "pyotp>=2.9,<3",
    "cryptography>=43",
    "zxcvbn>=4.4,<5",
    "email-validator>=2.1",
    "pysnmp>=7,<8",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx2>=2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["siem_api*"]

[tool.setuptools.package-data]
siem_api = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

