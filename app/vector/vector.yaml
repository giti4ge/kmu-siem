# KMU-SIEM – Vector (Ingest)
# Phase 1.3: Syslog (UDP/TCP/TLS) → generische ECS-Normalisierung → OpenSearch.
# Gerätespezifische Parser (Phase 3): Routing nach Geräteliste/Inhalt, siehe transforms.detect.

data_dir: /var/lib/vector

# Zeitstempel direkt als ECS-Feld; Absender-Host nicht als Top-Level "host" (ECS-Objekt)
log_schema:
  timestamp_key: "@timestamp"
  host_key: "siem.peer"

# Geheimnisse aus Datei (keine Umgebungsvariablen – Vector interpoliert diese seit
# 0.57 standardmäßig nicht mehr, und sie wären über /proc/<pid>/environ lesbar)
secret:
  siem:
    type: file
    path: /etc/vector/secrets/secrets.json

api:
  enabled: true
  address: "127.0.0.1:8686"

enrichment_tables:
  # Geräteliste: ip,type (fortigate | arubaos | instant_on | fs_s3900 | linux); wird vom Config-Generator gerendert
  devices:
    type: file
    file:
      path: /etc/vector/devices.csv
      encoding:
        type: csv
        include_headers: true

sources:
  # Extern 514/udp+tcp → per nftables umgeleitet auf 10514
  syslog_udp:
    type: syslog
    mode: udp
    address: "0.0.0.0:10514"
  syslog_tcp:
    type: syslog
    mode: tcp
    address: "0.0.0.0:10514"
  syslog_tls:
    type: syslog
    mode: tcp
    address: "0.0.0.0:6514"
    tls:
      enabled: true
      crt_file: /etc/vector/certs/syslog.crt
      key_file: /etc/vector/certs/syslog.key

transforms:
  # Gerätetyp bestimmen: 1. Geräteliste (Quell-IP → Typ, vom Config-Generator gerendert),
  # 2. Auto-Detect am Inhalt (nur eindeutige Formate), sonst leer → generischer Parser.
  detect:
    type: remap
    inputs: ["syslog_*"]
    source: |
      dt = ""
      rec, err = get_enrichment_table_record("devices", {"ip": string(.source_ip) ?? ""})
      if err == null { dt = string(rec.type) ?? "" }
      if dt == "" {
          msg = string(.message) ?? ""
          an = string(.appname) ?? ""
          hn = string(.hostname) ?? ""
          if contains(msg, "devid=") || contains(an, "devid=") || contains(hn, "devid=") {
              dt = "fortigate"
          } else if starts_with(an, "%") || match(msg, r'^%[A-Z0-9_]+-\d-[A-Z0-9_]+:') {
              dt = "fs_s3900"
          } else if includes(["ports", "FFI", "mgr", "stp", "lacp", "dhcp-snoop", "arp-prot"], an) {
              dt = "arubaos"
          } else if includes(["sshd", "sudo", "su", "su-l", "systemd", "systemd-logind", "CRON", "cron", "audit", "auditd", "audispd", "yum", "dnf", "apt", "apt-get", "dpkg", "packagekitd", "zypper", "polkitd", "useradd", "userdel", "usermod", "groupadd", "passwd", "login"], an) {
              dt = "linux"
          }
      }
      .siem.device_type = dt

  route_device:
    type: route
    inputs: ["detect"]
    route:
      fortigate: '.siem.device_type == "fortigate"'
      arubaos: '.siem.device_type == "arubaos"'
      instant_on: '.siem.device_type == "instant_on"'
      fs_s3900: '.siem.device_type == "fs_s3900"'
      linux: '.siem.device_type == "linux"'

  fortigate:
    type: remap
    inputs: ["route_device.fortigate"]
    file: /etc/vector/parsers/fortigate.vrl
    drop_on_error: false
    reroute_dropped: false

  arubaos:
    type: remap
    inputs: ["route_device.arubaos"]
    file: /etc/vector/parsers/arubaos.vrl
    drop_on_error: false

  aruba_instant_on:
    type: remap
    inputs: ["route_device.instant_on"]
    file: /etc/vector/parsers/aruba_instant_on.vrl
    drop_on_error: false

  fs_s3900:
    type: remap
    inputs: ["route_device.fs_s3900"]
    file: /etc/vector/parsers/fs_s3900.vrl
    drop_on_error: false

  linux:
    type: remap
    inputs: ["route_device.linux"]
    file: /etc/vector/parsers/linux.vrl
    drop_on_error: false

  normalize:
    type: remap
    inputs: ["route_device._unmatched"]
    source: |
      # --- Herkunft --------------------------------------------------------
      .observer.ip = del(.source_ip)
      .siem.collector = "vector"
      .siem.pipeline = "syslog.generic"

      # --- Syslog-Kopf → ECS ------------------------------------------------
      hostname = del(.hostname)
      if hostname != null { .host.hostname = hostname }
      appname = del(.appname)
      if appname != null { .process.name = appname }
      procid = del(.procid)
      if procid != null { .process.pid = to_int(procid) ?? null }
      .log.syslog.facility.name = del(.facility)
      .log.syslog.severity.name = del(.severity)
      .log.syslog.version = del(.version)
      .log.syslog.msgid = del(.msgid)
      .log.level = .log.syslog.severity.name

      # --- Ereignis ---------------------------------------------------------
      .event.kind = "event"
      .event.dataset = "syslog.generic"
      .event.ingested = now()
      .event.original = .message

      # --- Kategorie (Index) ------------------------------------------------
      # Ohne passenden Geräte-Parser → "unparsed" (SPEC 3.2). Selbsttest → "system".
      .siem.category = "unparsed"
      if .process.name == "siem-selftest" { .siem.category = "system" }

sinks:
  opensearch:
    type: elasticsearch
    inputs: ["normalize", "fortigate", "arubaos", "aruba_instant_on", "fs_s3900", "linux"]
    endpoints: ["https://127.0.0.1:9200"]
    api_version: v8
    mode: bulk
    bulk:
      index: "siem-{{ siem.category }}-%Y.%m.%d"
    auth:
      strategy: basic
      user: vector
      password: "SECRET[siem.opensearch_password]"
    tls:
      ca_file: /etc/vector/certs/ca.crt
    compression: gzip
    batch:
      timeout_secs: 1
    healthcheck:
      enabled: false
    # Disk-Puffer: übersteht Neustarts von Vector und Ausfälle von OpenSearch
    buffer:
      type: disk
      max_size: 10737418240
      when_full: block
