# KMU-SIEM – OpenSearch (Single Node), vom Installer bereitgestellt
cluster.name: siem
node.name: siem-node-1
discovery.type: single-node

# Nur lokal erreichbar (Zugriff ausschließlich über Vector, API und Proxy)
network.host: 127.0.0.1
http.port: 9200
transport.port: 9300

path.repo: ["/usr/share/opensearch/snapshots"]
bootstrap.memory_lock: true

# Speicher-Schwellen (SPEC 4.5); der Speicher-Wächter reagiert bereits ab 75 %/85 %
cluster.routing.allocation.disk.threshold_enabled: true
cluster.routing.allocation.disk.watermark.low: 85%
cluster.routing.allocation.disk.watermark.high: 90%
cluster.routing.allocation.disk.watermark.flood_stage: 95%

# Nur eigene und System-Indizes dürfen automatisch entstehen
action.auto_create_index: "+siem-*,+.*,-*"
action.destructive_requires_name: true

# --- Security-Plugin -----------------------------------------------------------
plugins.security.ssl.transport.pemcert_filepath: certs/node.pem
plugins.security.ssl.transport.pemkey_filepath: certs/node-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: certs/ca.pem
plugins.security.ssl.transport.enforce_hostname_verification: false
plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.pemcert_filepath: certs/node.pem
plugins.security.ssl.http.pemkey_filepath: certs/node-key.pem
plugins.security.ssl.http.pemtrustedcas_filepath: certs/ca.pem
plugins.security.ssl.http.enabled_protocols: ["TLSv1.3", "TLSv1.2"]
plugins.security.ssl.transport.enabled_protocols: ["TLSv1.3", "TLSv1.2"]
plugins.security.allow_default_init_securityindex: true
plugins.security.authcz.admin_dn:
  - "CN=siem-admin,OU=siem,O=kmu-siem"
plugins.security.nodes_dn:
  - "CN=opensearch,OU=siem,O=kmu-siem"
plugins.security.restapi.roles_enabled: ["all_access"]
plugins.security.system_indices.enabled: true
plugins.security.audit.type: noop
plugins.security.unsupported.restapi.allow_securityconfig_modification: true
