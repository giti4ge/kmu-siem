name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ShellCheck, Python, Doku-Links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x -s bash -P host host/install.sh host/lib/*.sh
          shellcheck -s bash tests/integration/*.sh tests/vm/*.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install --quiet ruff
          ruff check tests/generators tools
      - name: Doku-Links prüfen
        run: python tools/check_links.py

  unit:
    name: Unit-Tests Installer (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Werkzeuge
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends bats git ca-certificates openssh-client util-linux iproute2 >/dev/null
      - uses: actions/checkout@v7
      - name: bats
        run: bats --print-output-on-failure tests/installer

  integration:
    name: Preflight im Debian-13-Container
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Werkzeuge wie Debian-Standardinstallation
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates wget iproute2 util-linux procps >/dev/null
      - uses: actions/checkout@v7
      - name: Preflight-Integrationstest
        run: bash tests/integration/preflight-container.sh
