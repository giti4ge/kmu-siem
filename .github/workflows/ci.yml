name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ShellCheck, Python, Doku-Links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -x -s bash -P host host/install.sh host/lib/*.sh
          shellcheck -s bash tests/integration/*.sh tests/vm/*.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install --quiet ruff
          ruff check host/siem-hostd app/opensearch app/control-plane/backend tests/hostd tests/control_plane tests/generators tests/vm tools
      - name: Doku-Links prüfen
        run: python tools/check_links.py

  unit:
    name: Unit-Tests Installer und siem-hostd (Debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Werkzeuge
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends bats git ca-certificates openssh-client util-linux iproute2 python3 >/dev/null
      - uses: actions/checkout@v7
      - name: bats
        run: bats --print-output-on-failure tests/installer
      - name: siem-hostd (unittest)
        run: python3 -m unittest discover -s tests/hostd -v

  control-plane:
    name: Control-Plane (pytest, Rollen-Matrix, Audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: pip install --quiet "./app/control-plane/backend[test]"
      - name: pytest
        run: python -m pytest tests/control_plane -q
      - name: Image bauen und im Container testen (read-only, uid 2100)
        run: |
          docker build -q -t siem-api:ci app/control-plane/backend
          mkdir -p /tmp/cp/config-db /tmp/cp/secrets && sudo chown -R 2100:2100 /tmp/cp
          docker run -d --name api --network host --read-only --tmpfs /tmp --user 2100:2100             --security-opt no-new-privileges:true --cap-drop ALL             -v /tmp/cp/config-db:/data/config-db -v /tmp/cp/secrets:/data/secrets siem-api:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health && break; sleep 1; done
          echo 'Gruene-Wiese-am-Fluss-2026!' | docker exec -i api python -m siem_api.cli create-admin --password-stdin
          curl -fsS -H 'Content-Type: application/json'             -d '{"username":"admin","password":"Gruene-Wiese-am-Fluss-2026!"}'             http://127.0.0.1:8000/api/auth/login | grep -q '"stage":"mfa_enroll"'
          docker exec api python -m siem_api.cli verify-audit
          [ "$(docker inspect -f '{{.State.Health.Status}}' api)" != unhealthy ]
          docker logs api 2>&1 | tail -5

  frontend:
    name: Frontend (TypeScript, Build, i18n)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/control-plane/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/control-plane/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Keine hartcodierten Texte, DE/EN vollständig
        run: python3 ../../../tools/check_i18n.py
      - name: CSP-tauglich (keine Inline-Skripte)
        run: "! grep -E '<script>|<script [^>]*>[^<]' ../../proxy/html/index.html"

  zap:
    name: ZAP-Baseline (Web-UI + API hinter dem Proxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/control-plane/frontend/package-lock.json
      - name: Web-UI und API-Image bauen
        run: |
          (cd app/control-plane/frontend && npm ci --no-audit --no-fund --silent && npm run build)
          docker build -q -t siem-api:zap app/control-plane/backend
      - name: api + proxy aus der echten Compose-Datei starten
        run: |
          D=/tmp/siem
          mkdir -p $D/config-db $D/secrets/control-plane $D/secrets/pki/proxy $D/secrets/dashboards && touch $D/secrets/dashboards/dashboards.env
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost"             -keyout $D/secrets/pki/proxy/web.key -out $D/secrets/pki/proxy/web.crt 2>/dev/null
          sudo chown -R 2100:2100 $D/config-db $D/secrets/control-plane
          sudo chown -R 101:101 $D/secrets/pki/proxy
          SIEM_DATA=$D SIEM_API_IMAGE=siem-api:zap OPENSEARCH_JAVA_OPTS=-Xmx1g             docker compose -p siem -f app/docker-compose.yml up -d api proxy
          for i in $(seq 1 60); do curl -skf https://127.0.0.1:8443/api/health && break; sleep 2; done
      - name: ZAP-Baseline-Scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable             zap-baseline.py -t https://127.0.0.1:8443/ -J report.json -I || true
          python3 - <<'EOF'
          import json, sys
          r = json.load(open("zap/report.json"))
          alerts = [a for s in r.get("site", []) for a in s.get("alerts", [])]
          for a in sorted(alerts, key=lambda a: -int(a["riskcode"])):
              print(f'{a["riskdesc"]:<28} {a["name"]} ({a["count"]})')
          bad = [a for a in alerts if int(a["riskcode"]) >= 2]
          print(f"{len(alerts)} Hinweise, davon High/Medium: {len(bad)}")
          sys.exit(1 if bad else 0)
          EOF
      - name: Container-Protokolle bei Fehler
        if: failure()
        run: docker logs siem-proxy 2>&1 | tail -30; docker logs siem-api 2>&1 | tail -30

  integration:
    name: Preflight im Debian-13-Container
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Werkzeuge wie Debian-Standardinstallation
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates wget iproute2 util-linux procps >/dev/null
      - uses: actions/checkout@v7
      - name: Preflight-Integrationstest
        run: bash tests/integration/preflight-container.sh

  app-config:
    name: Anwendungskonfiguration (Vector, Compose, nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test-Zertifikate und Umgebung
        run: |
          mkdir -p /tmp/siem/data/app /tmp/siem/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=test" \
            -keyout /tmp/siem/certs/key.pem -out /tmp/siem/certs/cert.pem 2>/dev/null
          mkdir -p /tmp/siem/data/secrets/vector /tmp/siem/data/secrets/dashboards && touch /tmp/siem/data/secrets/dashboards/dashboards.env
          echo '{"opensearch_password": "test"}' > /tmp/siem/data/secrets/vector/secrets.json
      - name: Compose-Datei prüfen
        run: SIEM_DATA=/tmp/siem/data OPENSEARCH_JAVA_OPTS="-Xms1g -Xmx1g" docker compose -f app/docker-compose.yml config -q
      - name: Vector-Konfiguration prüfen
        run: |
          IMG=$(grep -oE 'timberio/vector:[^ ]+' app/docker-compose.yml)
          docker run --rm \
            -v "$PWD/app/vector/vector.yaml:/etc/vector/vector.yaml:ro" \
            -v "$PWD/app/vector/parsers:/etc/vector/parsers:ro" \
            -v /tmp/siem/data/secrets/vector/secrets.json:/etc/vector/secrets/secrets.json:ro \
            -v /tmp/siem/certs/cert.pem:/etc/vector/certs/syslog.crt:ro \
            -v /tmp/siem/certs/key.pem:/etc/vector/certs/syslog.key:ro \
            -v /tmp/siem/certs/cert.pem:/etc/vector/certs/ca.crt:ro \
            "$IMG" validate --no-environment /etc/vector/vector.yaml
      - name: Parser-Tests (vector test, VRL-Fixtures je Hersteller)
        run: |
          IMG=$(grep -oE 'timberio/vector:[^ ]+' app/docker-compose.yml)
          TESTS=$(cd app/vector/tests && printf '/etc/vector/tests/%s ' *.yaml)
          docker run --rm \
            -v "$PWD/app/vector/vector.yaml:/etc/vector/vector.yaml:ro" \
            -v "$PWD/app/vector/parsers:/etc/vector/parsers:ro" \
            -v "$PWD/app/vector/tests:/etc/vector/tests:ro" \
            -v /tmp/siem/data/secrets/vector/secrets.json:/etc/vector/secrets/secrets.json:ro \
            -v /tmp/siem/certs/cert.pem:/etc/vector/certs/syslog.crt:ro \
            -v /tmp/siem/certs/key.pem:/etc/vector/certs/syslog.key:ro \
            -v /tmp/siem/certs/cert.pem:/etc/vector/certs/ca.crt:ro \
            "$IMG" test --no-environment /etc/vector/vector.yaml $TESTS
      - name: nginx-Konfiguration prüfen (inkl. ModSecurity/CRS)
        run: |
          IMG=$(grep -oE 'owasp/modsecurity-crs:[^ ]+' app/docker-compose.yml)
          chmod 0644 /tmp/siem/certs/*.pem
          docker run --rm -e PORT=8080 -e SSL_PORT=8443 -e BACKEND=http://127.0.0.1:8000 \
            -v "$PWD/app/proxy/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro" \
            -v /tmp/siem/certs/cert.pem:/etc/nginx/siem-certs/web.crt:ro \
            -v /tmp/siem/certs/key.pem:/etc/nginx/siem-certs/web.key:ro \
            "$IMG" nginx -t
      - name: Dashboards-Konfiguration prüfen (Start ohne Konfigurationsfehler)
        run: |
          IMG=$(grep -oE 'opensearchproject/opensearch-dashboards:[^ ]+' app/docker-compose.yml)
          mkdir -p /tmp/osd-certs && cp /tmp/siem/certs/cert.pem /tmp/osd-certs/ca.crt && chmod 0644 /tmp/osd-certs/ca.crt
          docker run -d --name osd --network host -e KIBANASERVER_PASSWORD=x -e COOKIE_PASSWORD=$(openssl rand -hex 20)             -v "$PWD/app/dashboards/opensearch_dashboards.yml:/usr/share/opensearch-dashboards/config/opensearch_dashboards.yml:ro"             -v /tmp/osd-certs:/usr/share/opensearch-dashboards/config/certs:ro "$IMG"
          sleep 45
          docker logs osd 2>&1 | grep -E '"fatal"|InvalidConfigurationError|FATAL' && exit 1
          [ "$(docker inspect -f '{{.State.Running}}' osd)" = true ] || { docker logs osd 2>&1 | tail -20; exit 1; }
      - name: OpenSearch-Init (Syntax)
        run: python3 -c "import ast,sys; ast.parse(open('app/opensearch/init.py').read())"
