name: VM-Test (frische Debian-13-VM)

# Installiert auf einer frischen Debian-13-VM (QEMU) und prüft Preflight,
# unbeaufsichtigte Installation und Resume. Dauer ca. 5–15 Minuten.
on:
  pull_request:
    paths:
      - "host/**"
      - "tests/vm/**"
      - ".github/workflows/vm-test.yml"
  push:
    branches: [main]
    paths:
      - "host/**"
      - "tests/vm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    name: Debian 13 VM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "kein /dev/kvm – Software-Emulation"
      - name: QEMU installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
      - name: Debian-Image cachen
        uses: actions/cache@v4
        with:
          path: .vm/base.qcow2
          key: debian-13-genericcloud-${{ github.run_id }}
          restore-keys: debian-13-genericcloud-
      - name: VM-Tests
        run: bash tests/vm/run-vm-tests.sh
      - name: Serielle Konsole bei Fehler
        if: failure()
        run: tail -100 .vm/serial.log || true
