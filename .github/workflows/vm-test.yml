name: VM-Test (frische Debian-13-VM)

# Installiert auf einer frischen Debian-13-VM (QEMU) und prüft Preflight,
# unbeaufsichtigte Installation, Resume, Repair sowie Varianten (interaktiv/Proxy/
# ohne zweite Disk, Abbruch in jedem Schritt). Dauer ca. 20–40 Minuten.
on:
  pull_request:
    paths:
      - "host/**"
      - "app/**"
      - "tests/vm/**"
      - ".github/workflows/vm-test.yml"
  push:
    branches: [main]
    paths:
      - "host/**"
      - "app/**"
      - "tests/vm/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm:
    name: Debian 13 VM
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "kein /dev/kvm – Software-Emulation"
      - name: QEMU installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
      - name: Web-UI bauen (wird mit dem Bundle übertragen)
        working-directory: app/control-plane/frontend
        run: npm ci --no-audit --no-fund --silent && npm run build
      - name: Control-Plane-Image bauen (wird mit dem Bundle übertragen)
        run: |
          ver=$(cat VERSION)
          docker build -q -t "ghcr.io/giti4ge/kmu-siem/api:$ver" app/control-plane/backend
          mkdir -p app/images
          docker save -o app/images/api.tar "ghcr.io/giti4ge/kmu-siem/api:$ver"
          echo "ghcr.io/giti4ge/kmu-siem/api:$ver" > app/images/api.ref
          docker build -q -t "ghcr.io/giti4ge/kmu-siem/openwec:$ver" app/openwec
          docker save -o app/images/openwec.tar "ghcr.io/giti4ge/kmu-siem/openwec:$ver"
          echo "ghcr.io/giti4ge/kmu-siem/openwec:$ver" > app/images/openwec.ref
      - name: Debian-Image cachen
        uses: actions/cache@v6
        with:
          path: .vm/base.qcow2
          key: debian-13-genericcloud-${{ github.run_id }}
          restore-keys: debian-13-genericcloud-
      - name: VM-Tests
        run: bash tests/vm/run-vm-tests.sh
      - name: Serielle Konsole bei Fehler
        if: failure()
        run: tail -100 .vm/serial.log || true

  variants:
    # Abnahmekriterien Phase 1: interaktiv ohne zweite Disk mit Proxy und ohne SSH-Schlüssel;
    # Abbruch in jedem Schritt mit --resume
    name: Debian 13 VM – ${{ matrix.variant }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [interactive, resume]
    steps:
      - uses: actions/checkout@v7
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: QEMU, sshpass und squid installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils sshpass squid >/dev/null
          sudo systemctl restart squid
          for i in $(seq 1 30); do ss -Hltn | grep -q ':3128 ' && break; sleep 1; done
          curl -fsS -o /dev/null -x http://127.0.0.1:3128 http://deb.debian.org/debian/dists/trixie/Release
          sleep 2
          sudo chmod 0755 /var/log/squid
          sudo chmod 0644 /var/log/squid/access.log
          ls -la /var/log/squid/
          tail -3 /var/log/squid/access.log
      - name: Web-UI bauen (wird mit dem Bundle übertragen)
        working-directory: app/control-plane/frontend
        run: npm ci --no-audit --no-fund --silent && npm run build
      - name: Control-Plane-Image bauen (wird mit dem Bundle übertragen)
        run: |
          ver=$(cat VERSION)
          docker build -q -t "ghcr.io/giti4ge/kmu-siem/api:$ver" app/control-plane/backend
          mkdir -p app/images
          docker save -o app/images/api.tar "ghcr.io/giti4ge/kmu-siem/api:$ver"
          echo "ghcr.io/giti4ge/kmu-siem/api:$ver" > app/images/api.ref
          docker build -q -t "ghcr.io/giti4ge/kmu-siem/openwec:$ver" app/openwec
          docker save -o app/images/openwec.tar "ghcr.io/giti4ge/kmu-siem/openwec:$ver"
          echo "ghcr.io/giti4ge/kmu-siem/openwec:$ver" > app/images/openwec.ref
      - name: Debian-Image cachen
        uses: actions/cache@v6
        with:
          path: .vm/base.qcow2
          key: debian-13-genericcloud-${{ github.run_id }}-${{ matrix.variant }}
          restore-keys: debian-13-genericcloud-
      - name: VM-Test ${{ matrix.variant }}
        run: bash tests/vm/run-vm-variants.sh ${{ matrix.variant }}
      - name: Serielle Konsole bei Fehler
        if: failure()
        run: tail -100 .vm/serial.log || true
