target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S311",  # random ist für Testdaten ausreichend
    "S101",  # assert in Hilfsskripten erlaubt
]

[lint.per-file-ignores]
"tests/**" = ["E501", "S106", "S603", "S607"]  # erwartete Ausgaben, Testkennwörter, sh -n im Test
"app/control-plane/backend/siem_api/wec.py" = ["E501"]  # PowerShell-Vorlage und XPath-Abfragen
"app/control-plane/backend/siem_api/linux_onboarding.py" = ["E501"]  # Shell-Vorlage
"app/control-plane/backend/siem_api/sophos.py" = ["E501"]  # API-Pfade und Feldlisten
"app/control-plane/backend/siem_api/fortigate.py" = ["E501"]  # API-Pfade und Ereignisaufbau
"app/control-plane/backend/siem_api/snmp_config.py" = ["E501"]  # Zuordnung verschlüsselter Felder
"app/control-plane/backend/siem_api/alerts.py" = ["E501"]  # Regeltexte
"app/control-plane/backend/siem_api/dashboard.py" = ["E501"]
"app/control-plane/backend/siem_api/ai.py" = ["E501"]
"app/control-plane/backend/siem_api/updates.py" = ["E501"]
"app/control-plane/backend/siem_api/reports.py" = ["E501"]
"app/control-plane/backend/siem_api/routers/reports.py" = ["E501"]
"app/control-plane/backend/siem_api/active_response.py" = ["E501"]
"app/control-plane/backend/siem_api/routers/ar.py" = ["E501"]
"app/control-plane/backend/siem_api/routers/ai.py" = ["E501"]
"app/control-plane/backend/siem_api/routers/alerts.py" = ["E501"]
"app/control-plane/backend/siem_api/main.py" = ["E501"]

[lint.flake8-bugbear]
# FastAPI-Abhängigkeiten in Standardwerten sind das vorgesehene Muster
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query",
    "siem_api.deps.require", "siem_api.deps.stages",
]

[lint.isort]
known-first-party = ["siem_api", "conftest"]
