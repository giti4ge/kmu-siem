target-version = "py311"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "S311",  # random ist für Testdaten ausreichend
    "S101",  # assert in Hilfsskripten erlaubt
]

[lint.per-file-ignores]
"tests/**" = ["E501"]  # erwartete Ausgaben dürfen lang sein
"app/control-plane/backend/siem_api/wec.py" = ["E501"]  # PowerShell-Vorlage und XPath-Abfragen

[lint.flake8-bugbear]
# FastAPI-Abhängigkeiten in Standardwerten sind das vorgesehene Muster
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query",
    "siem_api.deps.require", "siem_api.deps.stages",
]

[lint.isort]
known-first-party = ["siem_api", "conftest"]
